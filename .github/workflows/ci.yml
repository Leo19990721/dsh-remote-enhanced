name: Check candidate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --ignore-workspace --config.auto-install-peers=false --config.strict-peer-dependencies=false
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code -- native-client.js
